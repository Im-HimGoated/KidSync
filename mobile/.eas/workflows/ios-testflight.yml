name: KidsSync iOS TestFlight upload

# No event triggers: run manually with `eas workflow:run ios-testflight.yml`.
concurrency:
  group: kidssync-ios-testflight
  cancel_in_progress: false

jobs:
  build_ios:
    name: Build signed iOS production app
    type: build
    params:
      platform: ios
      profile: production

  upload_ios:
    name: Upload this build without TestFlight group setup
    needs: [build_ios]
    runs_on: linux-medium
    env:
      EAS_BUILD_ID: ${{ needs.build_ios.outputs.build_id }}
      BUILT_BUNDLE_ID: ${{ needs.build_ios.outputs.app_identifier }}
      BUILT_PLATFORM: ${{ needs.build_ios.outputs.platform }}
      BUILT_DISTRIBUTION: ${{ needs.build_ios.outputs.distribution }}
      BUILT_PROFILE: ${{ needs.build_ios.outputs.profile }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Verify KidsSync scope and upload exact build
        run: |
          set -euo pipefail
          # EAS normally starts in the app base directory (mobile/). Also handle
          # a repository-root checkout without submitting from another app.
          if [ -f mobile/app.json ] && [ -f mobile/eas.json ]; then
            cd mobile
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const env = process.env;
          if (app.ios?.bundleIdentifier !== 'com.kidssync.app'
              || app.owner !== 'itzandrew'
              || app.extra?.eas?.projectId !== 'ffbe07cb-b90c-423c-9a27-39a1a3a5b585'
              || eas.submit?.production?.ios?.ascAppId !== '6838889267'
              || eas.build?.production?.distribution !== 'store'
              || eas.build?.production?.ios?.simulator !== false
              || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(env.EAS_BUILD_ID || '')
              || env.BUILT_BUNDLE_ID !== 'com.kidssync.app'
              || env.BUILT_PLATFORM !== 'ios'
              || env.BUILT_DISTRIBUTION !== 'store'
              || env.BUILT_PROFILE !== 'production') {
            throw new Error('Refusing submission: build or app configuration does not match KidsSync iOS production.');
          }
          NODE
          npx --yes eas-cli@27.11.0 submit --platform ios --profile production --id "$EAS_BUILD_ID" --non-interactive --no-auto-testflight-setup --wait
